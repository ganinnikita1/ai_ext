<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Почерк</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <svg xmlns="http://www.w3.org/2000/svg" class="sprite" aria-hidden="true" focusable="false">
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.6-6.4" /><path d="M3 4v5h5" /><path d="M12 8v4l3 2" /></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 13.2A8.5 8.5 0 1 1 10.8 3a7 7 0 0 0 10.2 10.2Z" /></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" /></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2" /><path d="M5 15V5a2 2 0 0 1 2-2h10" /></symbol>
      <symbol id="i-insert" viewBox="0 0 24 24"><path d="M12 3v11" /><path d="m8 10 4 4 4-4" /><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" /></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" /></symbol>
      <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="11" rx="3" /><path d="M5 10v1a7 7 0 0 0 14 0v-1" /><path d="M12 18v4M8 22h8" /></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18" /><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2" /><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" /></symbol>
      <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="m3 7 9 6 9-6" /></symbol>
      <symbol id="i-page" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z" /><path d="M14 3v6h6" /><path d="M8 13h8M8 17h6" /></symbol>
      <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="m12 3 1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8Z" /><path d="M19 15l.9 2.1 2.1.9-2.1.9L19 21l-.9-2.1-2.1-.9 2.1-.9Z" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6" /></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 21h20Z" /><path d="M12 9v5M12 18h.01" /></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9" /><path d="M3 4v5h5" /></symbol>
      <symbol id="i-save" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z" /><path d="M17 21v-8H7v8M7 3v5h8" /></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></symbol>
    </svg>

    <div class="app">
      <header class="topbar">
        <div class="topbar__brand">
          <span class="brand-mark" aria-hidden="true">П</span>
          <div class="topbar__titles">
            <h1 class="topbar__title">Почерк</h1>
            <p class="topbar__subtitle" id="provider-state">Проверяем настройки…</p>
          </div>
        </div>
        <div class="topbar__actions">
          <button class="icon-btn" id="btn-new" type="button" title="Новый чат" aria-label="Новый чат">
            <svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg>
          </button>
          <button class="icon-btn" id="btn-history" type="button" title="История чатов" aria-label="История чатов" aria-expanded="false" aria-controls="drawer">
            <svg class="icon" aria-hidden="true"><use href="#i-history"></use></svg>
          </button>
          <button class="icon-btn" id="btn-theme" type="button" title="Тема: авто" aria-label="Переключить тему">
            <svg class="icon" aria-hidden="true"><use href="#i-moon"></use></svg>
          </button>
          <button class="icon-btn" id="btn-settings" type="button" title="Настройки" aria-label="Открыть настройки">
            <svg class="icon" aria-hidden="true"><use href="#i-settings"></use></svg>
          </button>
        </div>
      </header>

      <div class="banner banner--demo" id="mode-banner" hidden>
        <span class="status-dot" aria-hidden="true"></span>
        <span class="banner__text" id="mode-banner-text"></span>
        <button class="text-btn" id="btn-banner-action" type="button">Настроить</button>
      </div>

      <div class="context-bar" id="context-bar" hidden>
        <svg class="icon context-bar__icon" aria-hidden="true"><use id="context-icon" href="#i-page"></use></svg>
        <div class="context-bar__body">
          <span class="context-bar__kind" id="context-kind">Страница</span>
          <span class="context-bar__title" id="context-title"></span>
        </div>
        <span class="badge context-bar__scope" id="context-scope" hidden></span>
        <button class="icon-btn icon-btn--sm" id="btn-context-refresh" type="button" title="Обновить контекст" aria-label="Обновить контекст">
          <svg class="icon" aria-hidden="true"><use href="#i-refresh"></use></svg>
        </button>
        <button class="icon-btn icon-btn--sm" id="btn-context-remove" type="button" title="Убрать контекст" aria-label="Убрать контекст">
          <svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg>
        </button>
      </div>

      <div class="message-picker" id="message-picker" hidden>
        <label class="message-picker__label" for="message-select">Сообщение</label>
        <select class="select-input message-picker__select" id="message-select" aria-label="Какое сообщение треда учитывать"></select>
      </div>

      <div class="message-meta" id="message-meta" hidden></div>

      <main class="chat" id="chat" role="log" aria-live="polite" aria-relevant="additions text" aria-label="Диалог с AI"></main>

      <section class="quickbar" aria-label="Быстрые действия">
        <button class="chip" id="btn-explain" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-page"></use></svg>
          Объяснить страницу
        </button>
        <button class="chip" id="btn-reply" type="button" disabled>
          <svg class="icon" aria-hidden="true"><use href="#i-mail"></use></svg>
          Ответить на письмо
        </button>
        <button class="chip" id="btn-summary" type="button" disabled>
          <svg class="icon" aria-hidden="true"><use href="#i-sparkles"></use></svg>
          Сводка письма
        </button>
      </section>

      <form class="composer" id="composer-form" autocomplete="off">
        <div class="composer__field">
          <label class="sr-only" for="input">Сообщение</label>
          <textarea
            id="input"
            class="composer__input"
            rows="1"
            placeholder="Спросите про страницу или письмо…"
            aria-describedby="voice-status composer-note"
          ></textarea>
        </div>
        <div class="composer__actions">
          <button class="icon-btn mic-btn" id="btn-mic" type="button" title="Голосовой ввод" aria-label="Голосовой ввод" aria-pressed="false">
            <svg class="icon" aria-hidden="true"><use href="#i-mic"></use></svg>
          </button>
          <span class="voice-status" id="voice-status" role="status" aria-live="polite"></span>
          <span class="composer__spacer"></span>
          <button class="icon-btn" id="btn-stop" type="button" title="Остановить ответ" aria-label="Остановить ответ" hidden>
            <svg class="icon" aria-hidden="true"><use href="#i-stop"></use></svg>
          </button>
          <button class="primary-btn" id="btn-send" type="submit" title="Спросить">
            <svg class="icon" aria-hidden="true"><use href="#i-chevron"></use></svg>
            Спросить
          </button>
        </div>
        <p class="composer__note" id="composer-note">
          <span>Enter — спросить, Shift+Enter — новая строка.</span>
          <span>Почерк не отправляет письма сам — только вставка текста.</span>
        </p>
      </form>
    </div>

    <aside class="drawer" id="drawer" aria-label="История чатов" hidden>
      <div class="drawer__head">
        <h2 class="drawer__title">История</h2>
        <button class="icon-btn" id="btn-drawer-close" type="button" aria-label="Закрыть историю">
          <svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg>
        </button>
      </div>
      <p class="drawer__hint">Почерк хранит чаты только в этом браузере (chrome.storage.local).</p>
      <ul class="session-list" id="session-list"></ul>
    </aside>

    <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
